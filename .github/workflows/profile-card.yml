name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  push:
    branches: [main]
    paths: [card/generate.py, card/portrait.json, card/ascii.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dateutil
      - run: python card/generate.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}  # PROFILE_TOKEN adds private-repo stats
          GH_USER: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-dark.svg assets/card-light.svg card/cache/
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
